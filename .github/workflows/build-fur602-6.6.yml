name: Build FUR-602 ImmortalWrt 6.6 mtwifi + UPnP

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  SOURCE_BRANCH: openwrt-24.10-6.6
  # 固定到 Run #3（已成功产出可刷 factory.bin）实际使用的上游 HEAD，
  # 避免分支后续提交导致构建不可复现 / 悄悄换内核或换包。
  # 如需升级源码，改这里并重新跑一次完整编译验证即可。
  SOURCE_COMMIT: ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8
  CONFIG_FILE: config/fur602-6.6-mtwifi-upnp.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 取出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext git-core \
            libncurses-dev libssl-dev zlib1g-dev libelf-dev \
            python3 python3-dev python3-setuptools python3-pip \
            unzip zip rsync wget curl subversion file \
            autoconf automake libtool autopoint pkg-config \
            ccache device-tree-compiler gperf help2man intltool \
            gcc-multilib g++-multilib libc6-dev-i386 \
            p7zip-full squashfs-tools xz-utils zstd \
            swig texinfo xmlto asciidoc uglifyjs \
            libgmp-dev libmpc-dev libmpfr-dev perl bzip2 gzip
          sudo apt-get install -y libncurses5-dev 2>/dev/null || true
          python3 -V; gcc --version | head -1

      - name: 准备 ccache
        run: |
          set -e
          # 必须显式创建 CCACHE_DIR：actions/cache 遇到不存在的路径会直接跳过保存
          # （post-job 报 "Path Validation Error ... no cache is being saved"），
          # 结果每次都是冷缓存。Run #4 因此比 Run #3 多花约 17 分钟。
          mkdir -p "$HOME/.ccache"
          # 本步骤内先导出，让 -M / -z 作用于同一个目录；
          # 绝不能用 sudo，否则配置会被写到 /root，与 runner 的缓存目录不一致。
          export CCACHE_DIR="$HOME/.ccache"
          /usr/bin/ccache -M 5G
          /usr/bin/ccache -z
          /usr/bin/ccache -s || true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # 加 run_number 保证每次都能保存一份新缓存（避免 "cache already exists"），
          # restore-keys 按「同 commit+同配置 → 同 commit → 任意」逐级回退复用。
          key: ccache-6.6-${{ env.SOURCE_COMMIT }}-${{ hashFiles('config/*.config') }}-${{ github.run_number }}
          restore-keys: |
            ccache-6.6-${{ env.SOURCE_COMMIT }}-${{ hashFiles('config/*.config') }}-
            ccache-6.6-${{ env.SOURCE_COMMIT }}-
            ccache-6.6-

      - name: 拉取源码（固定 commit）与 feeds
        run: |
          set -e
          echo "==> 目标源码 commit: $SOURCE_COMMIT"
          # 按 SHA 浅拉取，而不是 clone 分支 HEAD：分支会移动，构建不可复现。
          git init -q openwrt
          cd openwrt
          git remote add origin "$REPO_URL"
          if git fetch --depth=1 origin "$SOURCE_COMMIT"; then
            git checkout -q --detach FETCH_HEAD
          else
            echo "::warning::按 SHA 拉取失败，回退到分支 $SOURCE_BRANCH 最新提交（本次不可复现）"
            git fetch --depth=1 origin "$SOURCE_BRANCH"
            git checkout -q --detach FETCH_HEAD
          fi
          git log -1 --format='源码 HEAD : %H%n提交日期 : %cI%n提交标题 : %s'
          if [ "$(git rev-parse HEAD)" != "$SOURCE_COMMIT" ]; then
            echo "::warning::实际 HEAD 与固定 commit 不一致，本次构建不可复现"
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== feeds commit 快照（用于事后复现）==="
          for d in feeds/*/; do
            if [ -d "$d/.git" ]; then
              printf '%-28s %s\n' "$d" "$(git -C "$d" rev-parse HEAD)"
            fi
          done
          cp -v feeds.conf.default ../feeds.conf.snapshot 2>/dev/null || true

      - name: 注入 FUR-602 DTS 与设备定义
        run: |
          set -e
          # 本步骤的工作目录是仓库根（checkout 出来的 workspace），
          # dts/ 与 patches/ 就在当前目录，不要写成 ../dts / ../patches。
          test -f dts/mt7981b-honor-fur-602.dts
          test -f patches/apply-device.py
          cp dts/mt7981b-honor-fur-602.dts openwrt/target/linux/mediatek/dts/
          python3 patches/apply-device.py openwrt/target/linux/mediatek/image/filogic.mk
          grep -A7 '^define Device/honor_fur-602' openwrt/target/linux/mediatek/image/filogic.mk

      - name: 种子配置静态检查（无效符号 / 自相矛盾 / 残留插件）
        run: |
          set -euo pipefail
          CFG="$CONFIG_FILE"
          test -s "$CFG" || { echo "::error::种子配置为空或缺失: $CFG"; exit 1; }
          forbid() {
            if grep -qE -- "$2" "$CFG"; then
              echo "::error::种子配置出现无效/冲突符号: $1 (/$2/)"
              exit 1
            fi
            echo "OK: 无 $1"
          }
          forbid "5.4 树残留子目标"        '^CONFIG_TARGET_mediatek_mt7981=y'
          forbid "无效主题 bootstrap-mod"   'luci-theme-bootstrap-mod=y'
          forbid "无效包 kmod-nft-fullcone" '^CONFIG_PACKAGE_kmod-nft-fullcone=y'
          forbid "无效包 tc-mod-iptables"   '^CONFIG_PACKAGE_tc-mod-iptables=y'
          forbid "虚拟包名 miniupnpd"       '^CONFIG_PACKAGE_miniupnpd=y'
          forbid "多 profile 残留"          '^CONFIG_TARGET_(MULTI_PROFILE|PER_DEVICE_ROOTFS)=y'
          forbid "空设备包列表"             '^CONFIG_TARGET_DEVICE_PACKAGES_'
          forbid "BAND_STEERING 重复开启"   '^CONFIG_MTK_BAND_STEERING=y'
          forbid "代理插件残留"             '^# CONFIG_PACKAGE_(luci-app-passwall|luci-app-vssr|luci-app-rclone)_'
          # 通用检查：同一个符号不能既 =y 又 "is not set"（BAND_STEERING 曾踩过）
          python3 -c "
          import re, sys
          yes, no = set(), set()
          for line in open(sys.argv[1], encoding='utf-8'):
              line = line.strip()
              m = re.match(r'^(CONFIG_[A-Za-z0-9_]+)=', line)
              if m: yes.add(m.group(1)); continue
              m = re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set\$', line)
              if m: no.add(m.group(1))
          dup = sorted(yes & no)
          if dup:
              print('::error::种子配置存在自相矛盾符号: ' + ', '.join(dup))
              sys.exit(1)
          print('OK: 无 =y / is not set 自相矛盾符号')
          " "$CFG"
          echo "种子配置行数: $(wc -l < "$CFG")，CONFIG_PACKAGE_ 行数: $(grep -cE '^CONFIG_PACKAGE_' "$CFG")"

      - name: 写入 .config 并展开默认值
        run: |
          cd openwrt
          cp "../$CONFIG_FILE" .config
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          ./scripts/diffconfig.sh > ../effective.config
          head -50 ../effective.config
          echo "=== defconfig 之后 SSL 栈全部符号 ==="
          grep -E '^(CONFIG_PACKAGE_|# CONFIG_PACKAGE_)(libustream|wpad|px5g|luci-ssl|openssl-util|wget)' .config | sort || true
          echo "=== Kconfig 中 select libustream-mbedtls 的来源（溯源用） ==="
          grep -n -B6 'select PACKAGE_libustream-mbedtls' tmp/.config-package.in || true
          echo "=== Kconfig 中 select libustream-openssl 的来源（溯源用） ==="
          grep -n -B6 'select PACKAGE_libustream-openssl' tmp/.config-package.in || true

      - name: 编译前断言（内核 / 设备 / mtwifi / UPnP / SSL 栈 / 无代理插件）
        run: |
          set -euo pipefail
          cd openwrt
          MK=target/linux/mediatek/image/filogic.mk
          # 注意：绝不能写成 `grep -q ... && echo OK`——在 set -e 下，&& 列表中
          # 前置命令失败不会中断脚本，会静默漏检。必须用显式 if + exit 1。
          need() {
            if ! grep -qE -- "$2" "$3"; then
              echo "::error::FAIL: $1 —— 在 $3 中找不到 /$2/"
              exit 1
            fi
            echo "OK: $1"
          }
          forbid() {
            if grep -qE -- "$2" "$3"; then
              echo "::error::FAIL: 不应出现 $1"
              exit 1
            fi
            echo "OK: 无 $1"
          }
          echo "=== .config 中 UPnP / 无线相关实际符号 ==="
          grep -nE 'CONFIG_PACKAGE_(miniupnpd|luci-app-upnp|luci-i18n-upnp|kmod-mt_wifi|kmod-mt7915e)' .config || true
          echo "==========================================="
          need "内核 6.6"                'KERNEL_PATCHVER:=6.6' target/linux/mediatek/Makefile
          need "设备 honor_fur-602"      '^CONFIG_TARGET_mediatek_filogic_DEVICE_honor_fur-602=y' .config
          need "设备定义已注入"          '^define Device/honor_fur-602' "$MK"
          test -f target/linux/mediatek/dts/mt7981b-honor-fur-602.dts || { echo "::error::DTS 缺失"; exit 1; }
          echo "OK: DTS 已就位"
          need "闭源 mtwifi"             '^CONFIG_PACKAGE_kmod-mt_wifi=y' .config
          forbid "开源 mt7915e"          '^CONFIG_PACKAGE_kmod-mt7915e=y' .config
          need "luci-app-upnp"           '^CONFIG_PACKAGE_luci-app-upnp=y' .config
          # 24.10 中 miniupnpd 只是 PROVIDES 虚拟名，真实包是 nftables / iptables 变体
          need "miniupnpd-nftables"      '^CONFIG_PACKAGE_miniupnpd-nftables=y' .config
          forbid "miniupnpd-iptables"    '^CONFIG_PACKAGE_miniupnpd-iptables=y' .config
          forbid "SSR-Plus / HomeProxy"  '^CONFIG_PACKAGE_(luci-app-ssr-plus|luci-app-homeproxy)=y' .config
          # SSL 后端只能有一套：Run #2 就是 mbedtls + openssl 两个 variant
          # 抢 /lib/libustream-ssl.so，在 package/install 阶段 Error 255。
          echo "=== SSL 栈断言 ==="
          need "luci-ssl-openssl"        '^CONFIG_PACKAGE_luci-ssl-openssl=y' .config
          need "libustream-openssl"      '^CONFIG_PACKAGE_libustream-openssl=y' .config
          need "wpad-openssl"            '^CONFIG_PACKAGE_wpad-openssl=y' .config
          forbid "luci-ssl(mbedtls)"     '^CONFIG_PACKAGE_luci-ssl=y' .config
          forbid "libustream-mbedtls"    '^CONFIG_PACKAGE_libustream-mbedtls=y' .config
          forbid "px5g-mbedtls"          '^CONFIG_PACKAGE_px5g-mbedtls=y' .config
          forbid "wpad-mbedtls"          '^CONFIG_PACKAGE_wpad-mbedtls=y' .config
          # 主题：该分支不存在 luci-theme-bootstrap-mod，luci-light 硬依赖
          # +luci-theme-bootstrap；这里同时 need 真实包与 forbid 无效包。
          echo "=== 主题 / ttyd 断言 ==="
          need "luci-theme-bootstrap"    '^CONFIG_PACKAGE_luci-theme-bootstrap=y' .config
          forbid "无效主题 bootstrap-mod" '^CONFIG_PACKAGE_luci-theme-bootstrap-mod' .config
          forbid "无效包 nft-fullcone"   '^CONFIG_PACKAGE_kmod-nft-fullcone' .config
          # ttyd 按用户确认保留（上游默认包带入），只打印、不做强断言，
          # 避免上游默认包调整时把本构建误判为失败。
          echo "--- ttyd 实际符号（保留即可，不强制）---"
          grep -E '^CONFIG_PACKAGE_(ttyd|luci-app-ttyd)=' .config || true
          need "IMAGE_SIZE=116736k"      'IMAGE_SIZE := 116736k' "$MK"
          echo "=== 注入的设备块 ==="
          sed -n '/^define Device\/honor_fur-602/,/^endef/p' "$MK"

      - name: 下载源码包（dl）
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \; || true

      - name: 编译
        run: |
          cd openwrt
          echo "==> 开始编译 $(date '+%F %T')，$(nproc) 线程"
          make -j$(nproc) || {
            echo "==> 并行失败，改单线程定位错误 $(date '+%F %T')"
            make -j1 V=s
          }
          echo "==> 编译完成 $(date '+%F %T')"

      - name: ccache 命中统计（诊断用）
        if: always()
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          /usr/bin/ccache -s || true
          echo "CCACHE_DIR=$CCACHE_DIR"

      - name: 校验并收集产物
        run: |
          set -e
          mkdir -p artifact
          BIN=openwrt/bin/targets/mediatek/filogic
          ls -lh "$BIN" || true
          # 按 sha256sums 里出现的文件名全量收集；此前只挑 *honor_fur-602*
          # 会漏 feeds.buildinfo / version.buildinfo 和 5 个 mt79xx bl2 bin，
          # 导致下载后 sha256sum -c 出现 MISSING 条目。
          for f in "$BIN"/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              *honor_fur-602*|sha256sums|config.buildinfo|feeds.buildinfo|version.buildinfo|profiles.json|*.manifest|*bl2.bin)
                cp -v "$f" artifact/ ;;
            esac
          done
          cp -v effective.config artifact/ 2>/dev/null || true
          cp -v feeds.conf.snapshot artifact/ 2>/dev/null || true
          echo "=== artifact ==="; ls -lh artifact
          test -n "$(find artifact -name '*factory.bin')" || { echo "::error::缺少 factory.bin"; exit 1; }
          test -n "$(find artifact -name '*sysupgrade*')" || { echo "::error::缺少 sysupgrade"; exit 1; }
          echo "=== sha256sums 全量校验（含 feeds/version.buildinfo 与 bl2）==="
          (cd artifact && sha256sum -c sha256sums)
          echo "OK: factory / sysupgrade 已产出，sha256sums 全部条目齐全且校验通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fur602-6.6-mtwifi-upnp-${{ github.run_number }}
          path: artifact
          retention-days: 30

      - name: 输出构建摘要
        run: |
          {
            echo "## FUR-602 · ImmortalWrt 6.6 + 闭源 mtwifi + UPnP"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 源码 | \`padavanonly/immortalwrt-mt798x-6.6@$SOURCE_BRANCH\` |"
            echo "| 固定 commit | \`$SOURCE_COMMIT\` |"
            echo "| 内核 | 6.6 |"
            echo "| 无线 | MTK 闭源 \`kmod-mt_wifi\` |"
            echo "| 新增插件 | \`luci-app-upnp\` + \`miniupnpd-nftables\` + 中文包 |"
            echo "| 主题 | \`luci-theme-bootstrap\`（该分支无 bootstrap-mod） |"
            echo "| 保留 | ttyd（上游默认包带入，用户确认保留） |"
            echo "| 不含 | SSR-Plus / HomeProxy / PassWall / Samba / 下载类 / DDNS / MWAN3 / Zerotier |"
            echo ""
            echo "### 产物"
            echo '```'; ls -1 artifact; echo '```'
          } >> $GITHUB_STEP_SUMMARY
